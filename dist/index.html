<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Интерактивный учебный симулятор первого рабочего дня Manual QA">
  <title>Первый день QA</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Cpath d='M16 33l10 10 22-24' fill='none' stroke='%236ee7b7' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#080d18;--panel:#111a2b;--panel2:#172238;--line:#2a3955;--text:#f3f7ff;--muted:#aab8cf;--mint:#6ee7b7;--cyan:#67d4ff;--amber:#fbbf67;--red:#ff7b88;--shadow:0 24px 70px rgba(0,0,0,.36)}
    *{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#17365d 0,transparent 28rem),linear-gradient(180deg,#0a1020,#080d18 72%);font-size:16px;line-height:1.55}
    button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(100%,780px);min-height:100vh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;gap:12px;min-height:50px}.brand{font-weight:800;letter-spacing:-.02em}.day{margin-left:auto;color:var(--muted);font-size:.86rem}.progress{height:6px;background:#1e2b42;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--cyan));transition:width .35s ease}.stage{display:grid;place-items:center;min-height:calc(100vh - 104px);padding:28px 0}.card{width:100%;background:linear-gradient(145deg,rgba(23,34,56,.98),rgba(14,23,39,.98));border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,40px);box-shadow:var(--shadow);animation:enter .28s ease both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .eyebrow{display:flex;align-items:center;gap:8px;color:var(--mint);text-transform:uppercase;letter-spacing:.11em;font-weight:800;font-size:.76rem}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 16px currentColor}h1,h2,h3{margin:0 0 14px;line-height:1.12;letter-spacing:-.035em}h1{font-size:clamp(2.1rem,8vw,4rem)}h2{font-size:clamp(1.55rem,5vw,2.35rem)}h3{font-size:1.05rem;letter-spacing:0}.lead{font-size:1.08rem;color:#dbe7fa;margin:0 0 22px}.muted{color:var(--muted)}.small{font-size:.86rem}.avatar{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#203353;color:var(--cyan);font-weight:900}.person{display:flex;gap:12px;align-items:center;margin-bottom:20px}.person strong,.person span{display:block}.person span{color:var(--muted);font-size:.86rem}.quote{border-left:3px solid var(--cyan);padding:2px 0 2px 16px;margin:18px 0 24px;color:#e6efff}.actions{display:grid;gap:11px;margin-top:24px}.btn{width:100%;border:1px solid #395074;border-radius:14px;padding:14px 16px;background:#192842;color:var(--text);text-align:left;font-weight:700;transition:.16s ease}.btn:hover,.btn:focus-visible{border-color:var(--cyan);background:#213654;transform:translateY(-1px);outline:none}.btn.primary{background:linear-gradient(135deg,#4dd6a6,#56bcea);border:none;color:#06101a;text-align:center}.btn.ghost{text-align:center;background:transparent;color:var(--muted)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.field{display:grid;gap:8px;margin:26px 0}.field label{font-weight:800}.field input,.field textarea{width:100%;border:1px solid #3b4d6d;border-radius:14px;background:#0c1525;color:var(--text);padding:14px 15px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(103,212,255,.12)}.error{min-height:22px;color:var(--red);font-size:.9rem}.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{padding:7px 10px;border-radius:999px;background:#202e47;color:#cfe0fb;font-size:.8rem;border:1px solid #314363}.task{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:15px;background:#0d1728;margin:10px 0}.task b{color:var(--mint)}.choice{display:flex;align-items:flex-start;gap:12px;min-height:54px;padding:14px 16px;line-height:1.45}.choice .choice-mark{position:static;flex:0 0 22px;width:22px;height:22px;margin-top:1px;border:2px solid #5a7298;border-radius:50%}.feedback{border-radius:16px;padding:17px;margin:20px 0;background:#10271f;border:1px solid #27694f}.feedback.warn{background:#2b2111;border-color:#765820}.feedback.bad{background:#30171c;border-color:#7c3540}.feedback strong{display:block;margin-bottom:5px}.terminal{background:#050912;border:1px solid #263650;border-radius:16px;overflow:hidden;margin:18px 0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.82rem}.terminal-head{padding:9px 12px;background:#152036;color:#9fb0ca}.terminal-body{padding:14px;overflow:auto;white-space:pre-wrap}.req{color:#82d4ff}.ok{color:#73e2ae}.badtext{color:#ff8996}.warntext{color:#ffd080}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:15px;margin:16px 0}table{width:100%;border-collapse:collapse;min-width:530px;font-size:.82rem}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #263650}th{background:#18253b;color:#bcd0ed}tr:last-child td{border-bottom:0}.score{font-size:3.5rem;font-weight:900;color:var(--mint);line-height:1}.meter{display:grid;gap:12px;margin:22px 0}.meter-row{display:grid;grid-template-columns:115px 1fr 35px;align-items:center;gap:10px;font-size:.82rem}.bar{height:8px;border-radius:99px;background:#22314b;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint));border-radius:inherit}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#effff9;color:#07130f;padding:11px 16px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
    .avatar.photo{overflow:hidden;background:#203353}.avatar.photo img{width:100%;height:100%;display:block;object-fit:cover}.learning-visual{margin:18px 0;border:1px solid var(--line);border-radius:18px;background:#0b1424;overflow:hidden}.visual-caption{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;background:#17243a;color:#b8c9e2;font-size:.78rem}.shop-preview{padding:16px}.product-mini{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid #273650}.product-art{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#49c9ff,#335b9b);display:grid;place-items:center;font-size:1.5rem}.receipt{display:grid;gap:8px;padding-top:14px}.receipt div{display:flex;justify-content:space-between;gap:14px}.receipt .wrong{color:var(--amber);font-weight:800}.visual-note{margin:0;padding:11px 14px;background:#2b2111;color:#ffd894;font-size:.83rem;border-top:1px solid #765820}.network-visual{padding:12px}.network-row{display:grid;grid-template-columns:1.5fr .55fr .7fr;gap:8px;padding:10px;border-radius:10px;margin:5px 0;background:#132037;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.78rem}.network-row.duplicate{outline:1px solid #d89b3e;background:#2a2114}.network-row span:nth-child(2){color:var(--mint)}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.evidence-shot{min-height:94px;padding:12px;border:1px solid #354867;border-radius:12px;background:#111d31;display:flex;flex-direction:column;justify-content:space-between}.evidence-shot b{font-size:.84rem}.evidence-shot small{color:var(--muted)}.evidence-shot.good{border-color:#32896a;background:#10271f}.evidence-badge{align-self:flex-start;padding:4px 7px;border-radius:999px;background:#25405f;color:#d8eaff;font-size:.7rem}.evidence-shot.good .evidence-badge{background:#22634b;color:#d8fff0}
    @media(max-width:520px){.shell{padding-left:12px;padding-right:12px}.stage{padding:16px 0}.card{border-radius:20px;padding:22px}.day{display:none}.meter-row{grid-template-columns:95px 1fr 32px}.btn{padding:13px}.terminal{font-size:.74rem}.evidence-grid{grid-template-columns:1fr}.network-row{grid-template-columns:1.25fr .5fr .62fr;font-size:.7rem}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand">Первый день QA</div><div class="day" id="dayLabel">Учебная смена · 45–60 минут</div></header>
    <div class="progress" aria-label="Прогресс сценария"><span id="progressBar"></span></div>
    <section class="stage" id="app" aria-live="polite"></section>
  </main>
  <div class="toast" id="toast">Прогресс сохранён</div>
  <script>
  (()=>{
    const app=document.getElementById('app'),bar=document.getElementById('progressBar'),toast=document.getElementById('toast');
    const KEY='qa-first-day-v2';
    const base={step:0,name:'',score:0,decisions:{},bugs:[],hints:0,report:{title:'',actual:'',expected:''},started:false};
    let state={...base},resumeStep=1;
    try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.started){state={...base,...saved};resumeStep=Math.max(1,Math.min(Number(saved.step)||1,25));state.step=0}}catch(e){}
    const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const name=()=>esc(state.name||'тестировщик');
    const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)};
    const setStep=n=>{state.step=n;state.started=true;save();render();scrollTo({top:0,behavior:'smooth'})};
    const points=(id,value)=>{if(!(id in state.decisions)){state.score+=value;state.decisions[id]=value}save()};
    const shell=(eyebrow,title,body)=>`<article class="card"><div class="eyebrow"><span class="dot"></span>${eyebrow}</div><h2>${title}</h2>${body}</article>`;
    const person=(initials,who,role)=>`<div class="person"><div class="avatar${initials==='АН'?' photo':''}">${initials==='АН'?'<img src="anna-qa-mentor.webp" alt="Анна, QA-наставник" width="48" height="48">':initials}</div><div><strong>${who}</strong><span>${role}</span></div></div>`;
    const btn=(label,next,cls='btn')=>`<button class="${cls}" data-next="${next}">${label}</button>`;
    const option=(label,id,val,next)=>`<button class="btn choice" data-choice="${id}" data-value="${val}" data-next="${next}"><span class="choice-mark" aria-hidden="true"></span><span>${label}</span></button>`;
    const steps=[
      ()=>shell('Добро пожаловать','Первый день в QA',`<p class="lead">Короткая интерактивная смена в команде интернет-магазина. Твои решения повлияют на релиз.</p><div class="pillrow"><span class="pill">Реальные рабочие ситуации</span><span class="pill">DevTools</span><span class="pill">API</span><span class="pill">SQL</span></div><div class="actions">${btn(state.started?'Продолжить прохождение':'Начать',state.started?resumeStep:1,'btn primary')}${state.started?'<button class="btn ghost" data-new-run>Начать новое прохождение</button>':''}<a class="btn ghost" href="concept.html" style="display:block;text-decoration:none">Посмотреть новый рабочий стол</a></div>`),
      ()=>shell('Знакомство','Как к тебе обращаться?',`<p class="muted">Имя увидят только персонажи этой учебной смены. Оно сохранится на этом устройстве.</p><form id="nameForm"><div class="field"><label for="nameInput">Твоё имя</label><input id="nameInput" maxlength="24" autocomplete="given-name" placeholder="Например, Виктор" value="${esc(state.name)}"><div class="error" id="nameError"></div></div><button class="btn primary" type="submit">Начать рабочий день</button></form>`),
      ()=>shell('09:05 · Командный чат','Сборка готова к тестированию',`${person('АН','Анна','QA-наставник')}<div class="quote">Доброе утро, ${name()}! Сборка корзины ShopPoint готова на тестовом окружении. В твоём скоупе — промокод NEW10 и оформление заказа. Релиз-кандидат ждём после обеда.</div><div class="task"><b>Скоуп</b><span>Промокод, расчёт корзины и создание заказа.</span></div><div class="actions">${btn('Открыть задачу SP-214',3,'btn primary')}</div>`),
      ()=>shell('Задача SP-214','Требования к промокоду',`<p>Промокод <b>NEW10</b> даёт новому клиенту скидку 10% на товары. На доставку скидка не распространяется.</p><div class="pillrow"><span class="pill">Корзина</span><span class="pill">Промокоды</span><span class="pill">Релиз сегодня</span></div><p class="muted">Но кто именно считается «новым клиентом», не написано. Исследовать сборку можно сразу, но окончательный вывод должен опираться на согласованное правило.</p><h3>Что ты сделаешь?</h3><div class="actions">${option('Зафиксирую вопрос, уточню правило и параллельно осмотрю сборку','requirement',3,4)}${option('Сначала исследую сборку, отмечу гипотезу и затем уточню правило','requirement',2,4)}${option('Сам решу, что новый клиент — любой новый аккаунт','requirement',0,5)}</div>`),
      ()=>shell('Результат решения','Требование стало проверяемым',`${person('МП','Марина','Менеджер продукта')}<div class="quote">Хороший вопрос, ${name()}. Новый клиент — тот, у кого нет ни одного завершённого заказа.</div><div class="feedback"><strong>Профессиональный подход</strong>Изучать продукт и уточнять требования можно параллельно. Главное — не выдавать гипотезу за согласованное правило.</div><div class="actions">${btn('Подготовить чек-лист',6,'btn primary')}</div>`),
      ()=>shell('Последствие решения','Появился спорный результат',`${person('АН','Анна','QA-наставник')}<div class="quote">${name()}, мы не можем считать предположение требованием. Если команда понимает «нового клиента» иначе, баг окажется спорным.</div><div class="feedback warn"><strong>Что улучшить</strong>Можно изучать текущее поведение, но перед выводом нужно уточнить источник истины. В этой смене новым считается клиент без завершённых заказов.</div><div class="actions">${btn('Понял, подготовить чек-лист',6,'btn primary')}</div>`),
      ()=>shell('Планирование','С чего начать приёмку?',`<p>Перед выполнением проверок нужен короткий риск-ориентированный чек-лист.</p><div class="actions">${option('Проверю правило нового клиента, настройку NEW10, расчёт корзины и защиту создания заказа','priority',3,7)}${option('Сразу сделаю один успешный заказ без подготовки','priority',0,7)}${option('Начну с цветов и ссылок в подвале','priority',-1,7)}</div>`),
      ()=>shell('Админ-панель · Промокоды','Проверка настройки NEW10',`<div class="terminal"><div class="terminal-head">promo_rules · тестовое окружение</div><div class="terminal-body">code: NEW10<br>percent: 10<br>scope: products<br>exclude_delivery: true<br>new_customer: no_completed_orders</div></div><p>Требование и настройка согласованы. Теперь можно проверять применение правила на витрине.</p><h3>Зачем нужна эта проверка?</h3><div class="actions">${option('Чтобы отделить ошибку настройки от ошибки расчёта на витрине','promoSource',1,8)}${option('Она не нужна: интерфейса всегда достаточно','promoSource',-1,8)}</div>`),
      ()=>shell('ShopPoint · Корзина','Правильно ли рассчитана скидка?',`<figure class="learning-visual" aria-label="Экран корзины интернет-магазина"><figcaption class="visual-caption"><span>ShopPoint</span><span>Корзина · 1 товар</span></figcaption><div class="shop-preview"><div class="product-mini"><div class="product-art" aria-hidden="true">♫</div><div><b>Беспроводные наушники</b><div class="muted small">Количество: 1</div></div><b>100 BYN</b></div><div class="receipt"><div><span>Доставка</span><b>20 BYN</b></div><div class="wrong"><span>Скидка NEW10</span><span>−12 BYN</span></div><div><b>Итого</b><b>108 BYN</b></div></div></div><p class="visual-note">Сверь экран с требованием и настройкой промокода.</p></figure><p>NEW10 настроен на 10% только от стоимости товаров. Доставка исключена.</p><h3>Какой вывод подтверждают данные?</h3><div class="actions">${option('Расчёт неверен: ожидаемый итог — 110 BYN','discount',4,9)}${option('Расчёт верен: итог должен быть 108 BYN','discount',-2,10)}${option('Нельзя сделать вывод даже после проверки настройки','discount',0,10)}</div>`),
      ()=>shell('Несоответствие подтверждено','Ошибка в применении скидки',`<div class="feedback"><strong>Верно · +4</strong>Настройка NEW10 корректна: 10% от товара — 10 BYN, доставка не участвует. Ожидаемый итог: 100 − 10 + 20 = 110 BYN.</div><p>Мы не называли это дефектом заранее: сначала проверили правило, настройку и фактический расчёт.</p><div class="actions">${btn('Перейти к оформлению заказа',11,'btn primary')}</div>`),
      ()=>shell('Проверка решения','Факт расходится с источниками истины',`<div class="feedback bad"><strong>Несоответствие пропущено</strong>Требование и настройка исключают доставку из скидки, но приложение вычло 12 BYN. Ожидаемый итог — 110 BYN.</div><div class="actions">${btn('Перейти к оформлению заказа',11,'btn primary')}</div>`),
      ()=>shell('Подготовка исследования','DevTools открываем заранее',`<p>Network фиксирует запросы только после открытия. Поэтому до воспроизведения включи инструменты разработчика.</p><div class="task"><b>Подготовка</b><span>F12 → Network → Fetch/XHR → Preserve log. Затем воспроизведи действие.</span></div><h3>Что сделаешь перед нажатием?</h3><div class="actions">${option('Открою Network и только потом воспроизведу двойное нажатие','devtoolsReady',2,12)}${option('Сначала нажму, затем открою Network','devtoolsReady',-1,14)}</div>`),
      ()=>shell('ShopPoint · Оформление','Проверка повторной отправки',`<p>У корзины уже есть ID <b>C-7781</b>. Одно намерение пользователя должно создать один заказ. Кнопка не блокируется во время запроса, поэтому ты выполняешь негативную проверку: два быстрых нажатия.</p><div class="feedback"><strong>На экране</strong>Показано одно сообщение: «Заказ №1042 создан».</div><p>Как проверить фактический результат?</p><div class="actions">${option('Проверю количество POST-запросов и созданных заказов','evidence',4,13)}${option('Сразу назову это критическим дубликатом данных','evidence',0,14)}${option('Раз сообщение одно — проблемы нет','evidence',-2,14)}</div>`),
      ()=>shell('DevTools · Network','Повторная отправка подтверждена',`<figure class="learning-visual" aria-label="Учебный экран Network с двумя запросами создания заказа"><figcaption class="visual-caption"><span>DevTools</span><span>Network · Fetch/XHR</span></figcaption><div class="network-visual"><div class="network-row"><b>Name</b><b>Status</b><b>Time</b></div><div class="network-row duplicate"><span>orders</span><span>201</span><span>342 ms</span></div><div class="network-row duplicate"><span>orders</span><span>201</span><span>318 ms</span></div></div><p class="visual-note">Два POST-запроса после одного пользовательского намерения.</p></figure><div class="terminal"><div class="terminal-head">Подробности ответа</div><div class="terminal-body"><span class="req">POST /api/orders</span>   <span class="ok">201</span>   342 ms
Response: { "orderId": 1042 }

<span class="req">POST /api/orders</span>   <span class="ok">201</span>   318 ms
Response: { "orderId": 1043 }</div></div><div class="feedback"><strong>Технический факт · +4</strong>Это не две одинаковые строки: созданы два разных заказа с ID 1042 и 1043. Проблема — повторное создание заказа из одного пользовательского намерения.</div><div class="actions">${btn('Проверить бизнес-эффект через SQL',15,'btn primary')}</div>`),
      ()=>shell('Совет наставника','Доказательства нужно собрать заново',`${person('АН','Анна','QA-наставник')}<div class="quote">${name()}, Network надо открыть до воспроизведения. Повтори проверку с включённой записью запросов, затем сравни результат в базе.</div><div class="feedback warn"><strong>Профессиональный принцип</strong>Отделяй наблюдение, технические факты и вывод о дефекте.</div><div class="actions">${btn('Повторить с открытым Network',13,'btn primary')}</div>`),
      ()=>shell('Учебная SQL-консоль','Сверка последних заказов',`<p class="muted">Запрос ограничен нужными полями, пользователем и последними десятью заказами. Сортировка помогает увидеть свежий результат.</p><div class="field"><textarea id="sqlInput" rows="5" spellcheck="false">SELECT TOP 10 id, user_id, total, status, order_date\nFROM orders\nWHERE user_id = 77\nORDER BY order_date DESC;</textarea></div><button class="btn primary" id="runSql">Выполнить запрос</button><div id="sqlResult"></div>`),
      ()=>shell('Swagger · Контракт API','Сначала проверяем договорённость',`<div class="terminal"><div class="terminal-head">POST /api/promocodes/check</div><div class="terminal-body"><span class="ok">200</span> — промокод обработан<br><span class="warntext">422</span> — код промокода не существует<br><br>422 body:<br>{ "errorCode": "PROMO_NOT_FOUND" }</div></div><div class="feedback warn"><strong>Важно</strong>Сам по себе статус 200 не всегда ошибка: внешние и legacy-системы нередко передают бизнес-ошибку в теле. В этом упражнении источником истины является показанный контракт.</div><div class="actions">${btn('Сравнить фактический ответ',17,'btn primary')}</div>`),
      ()=>shell('API-проверка','Неверный промокод',`<div class="terminal"><div class="terminal-head">POST /api/promocodes/check</div><div class="terminal-body">Request
{ "code": "NOTREAL" }

Response   <span class="warntext">200 OK</span>
{ "valid": false, "discountPercent": 0 }</div></div><p>Фактический ответ сообщает бизнес-результат, но не соответствует показанному Swagger-контракту.</p><h3>Какой вывод корректен?</h3><div class="actions">${option('Зафиксировать расхождение: контракт ожидает 422 и PROMO_NOT_FOUND','api',3,18)}${option('Любой ответ 200 всегда является дефектом','api',0,18)}${option('Статус не важен, контракт можно игнорировать','api',-1,18)}</div>`),
      ()=>shell('Учебная Jira','Оформи главный дефект',`<p class="muted">Сравни доказательства и заполни три ключевых поля.</p><figure class="learning-visual" aria-label="Варианты доказательств для баг-репорта"><figcaption class="visual-caption"><span>Вложения к дефекту</span><span>Оценка полезности</span></figcaption><div class="evidence-grid"><div class="evidence-shot"><span class="evidence-badge">Подходит</span><b>Два POST-запроса</b><small>Метод, статус и время видны</small></div><div class="evidence-shot"><span class="evidence-badge">Подходит</span><b>Два созданных заказа</b><small>ID 1042 и 1043, одно намерение</small></div><div class="evidence-shot"><span class="evidence-badge">Слабо</span><b>Вся страница целиком</b><small>Проблемная область не выделена</small></div><div class="evidence-shot"><span class="evidence-badge">Слабо</span><b>Фото экрана</b><small>Текст запроса не читается</small></div></div></figure><form id="reportForm"><div class="field"><label>Заголовок</label><input id="rTitle" value="${esc(state.report.title)}" placeholder="Что происходит и при каком действии"></div><div class="field"><label>Фактический результат</label><textarea id="rActual" rows="3" placeholder="Что ты наблюдал">${esc(state.report.actual)}</textarea></div><div class="field"><label>Ожидаемый результат</label><textarea id="rExpected" rows="3" placeholder="Как должно работать">${esc(state.report.expected)}</textarea><div class="error" id="reportError"></div></div><button class="btn primary" type="submit">Создать дефект</button></form>`),
      ()=>shell('11:18 · Сообщение разработчика','Дефект не воспроизводится',`${person('ИР','Илья','Разработчик')}<div class="quote">${name()}, у меня заказ создался один раз. Может, закроем дефект, чтобы не задерживать релиз?</div><h3>Что ответишь?</h3><div class="actions">${option('Сначала сравню его шаги, окружение и данные, затем приложу свои доказательства','communication',4,21)}${option('Закрою: у разработчика не воспроизвелось','communication',-2,20)}${option('Напишу, что он просто плохо проверяет','communication',-3,20)}</div>`),
      ()=>shell('Последствие общения','Команда теряет важный сигнал',`${person('АН','Анна','QA-наставник')}<div class="quote">${name()}, решение о дефекте принимают по фактам. Давление или поспешное закрытие не заменяют сравнение шагов, окружения и тестовых данных.</div><div class="feedback bad"><strong>Риск для релиза</strong>Верни дефект в работу и предложи разработчику совместно воспроизвести точный сценарий.</div><div class="actions">${btn('Сравнить условия и добавить доказательства',21,'btn primary')}</div>`),
      ()=>shell('Дефект подтверждён','Условия воспроизведения совпали',`${person('ИР','Илья','Разработчик')}<div class="quote">Теперь вижу, ${name()}. Я нажимал медленнее и на другой сборке. На релиз-кандидате два быстрых нажатия создают два заказа. Исправляю блокировку кнопки и идемпотентность запроса.</div><div class="feedback"><strong>Сильная работа</strong>Уточнение «как именно ты проверяешь?» помогает найти различие без спора.</div><div class="actions">${btn('Получить исправленную сборку',22,'btn primary')}</div>`),
      ()=>shell('13:10 · Ретест','Исправление готово',`<p>Разработчик добавил блокировку кнопки и idempotency key. Ты повторяешь исходные шаги с заранее открытым Network.</p><div class="terminal"><div class="terminal-head">Network · повторный запрос</div><div class="terminal-body">POST /api/orders   <span class="ok">201</span>   orderId: 1051<br>POST /api/orders   <span class="warntext">409</span>   IDEMPOTENCY_CONFLICT</div></div><h3>Какой вывод корректен?</h3><div class="actions">${option('Ретест пройден: создан один заказ; зафиксирую результат и продолжу регресс','retest',3,23)}${option('Достаточно увидеть изменённый код — ретест не нужен','retest',-2,23)}</div>`),
      ()=>shell('Короткий регресс','Что проверить перед рекомендацией?',`<p>Исправление затронуло кнопку и создание заказа. Выбери достаточный короткий набор.</p><div class="actions">${option('Один клик, быстрый двойной клик, NEW10, неверный промокод и один созданный заказ в БД','regression',2,24)}${option('Только повторить двойной клик','regression',0,24)}${option('Перепроверить весь магазин без учёта риска','regression',1,24)}</div>`),
      ()=>shell('14:00 · Решение о релизе','Что сообщить тимлиду?',`${person('МП','Марина','Тимлид')}<div class="quote">${name()}, исправление прошло ретест, короткий регресс завершён. Какова твоя рекомендация?</div><div class="actions">${option('Сообщить факты: ретест и регресс пройдены, известных блокеров нет','release',4,25)}${option('Гарантировать, что в продукте больше нет дефектов','release',-2,25)}${option('QA единолично разрешает релиз','release',0,25)}</div>`),
      ()=>{const max=40,raw=Math.max(0,state.score),pct=Math.min(100,Math.round(raw/max*100));const level=pct>=80?'Уверенный старт':pct>=55?'Хорошая основа':'Есть что потренировать';return shell('Смена завершена',`${name()}, это был твой первый релиз`, `<div class="score">${pct}%</div><h3>${level}</h3><p class="muted">Оценка показывает качество решений в этой учебной смене. Её можно улучшить повторным прохождением.</p><div class="meter"><div class="meter-row"><span>Требования</span><div class="bar"><span style="width:${state.decisions.requirement>=2?100:35}%"></span></div><b>${state.decisions.requirement>=2?5:2}/5</b></div><div class="meter-row"><span>Исследование</span><div class="bar"><span style="width:${state.decisions.evidence===4&&state.decisions.devtoolsReady===2?100:45}%"></span></div><b>${state.decisions.evidence===4&&state.decisions.devtoolsReady===2?5:2}/5</b></div><div class="meter-row"><span>API и SQL</span><div class="bar"><span style="width:${state.decisions.api===3&&state.decisions.sql===3?100:60}%"></span></div><b>${state.decisions.api===3&&state.decisions.sql===3?5:3}/5</b></div><div class="meter-row"><span>Ретест</span><div class="bar"><span style="width:${state.decisions.retest===3&&state.decisions.regression===2?100:35}%"></span></div><b>${state.decisions.retest===3&&state.decisions.regression===2?5:2}/5</b></div></div><div class="feedback"><strong>Главный вывод</strong>Качественный QA проверяет источники истины, заранее собирает технические данные, точно называет факты, ретестит исправление и сообщает команде остаточный риск.</div><div class="actions"><button class="btn primary" data-new-run>Начать новое прохождение</button><button class="btn ghost" id="copyResult">Скопировать результат</button></div>`)}
    ];
    function render(){const i=Math.min(state.step,steps.length-1);bar.style.width=`${Math.round(i/(steps.length-1)*100)}%`;app.innerHTML=steps[i]();bind()}
    function bind(){document.querySelectorAll('[data-next]').forEach(el=>el.onclick=()=>setStep(+el.dataset.next));document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{points(el.dataset.choice,+el.dataset.value);setStep(+el.dataset.next)});document.querySelectorAll('[data-new-run]').forEach(el=>el.onclick=()=>{localStorage.removeItem(KEY);state={...base,step:1};resumeStep=1;render();scrollTo({top:0,behavior:'smooth'})});
      const nf=document.getElementById('nameForm');if(nf)nf.onsubmit=e=>{e.preventDefault();const input=document.getElementById('nameInput'),err=document.getElementById('nameError'),v=input.value.trim().replace(/\s+/g,' ');if(v.length<2){err.textContent='Введи имя минимум из двух символов.';return}if(!/^[\p{L}][\p{L}\s'-]{1,23}$/u.test(v)){err.textContent='Используй буквы, пробел, дефис или апостроф.';return}state.name=v;setStep(2)};
      const run=document.getElementById('runSql');if(run)run.onclick=()=>{const v=document.getElementById('sqlInput').value.trim(),out=document.getElementById('sqlResult'),normalized=v.replace(/\s+/g,' ').replace(/;\s*$/,'').toLowerCase(),expected='select top 10 id, user_id, total, status, order_date from orders where user_id = 77 order by order_date desc';if(normalized!==expected){out.innerHTML='<div class="feedback warn"><strong>Запрос не выполнен</strong>Ограничь результат десятью строками, перечисли нужные поля и отсортируй по order_date DESC.</div>';return}points('sql',3);out.innerHTML='<div class="tablewrap"><table><thead><tr><th>id</th><th>user_id</th><th>total</th><th>status</th><th>order_date</th></tr></thead><tbody><tr><td>1043</td><td>77</td><td>108.00</td><td>new</td><td>10:42:03</td></tr><tr><td>1042</td><td>77</td><td>108.00</td><td>new</td><td>10:42:02</td></tr></tbody></table></div><div class="feedback"><strong>Бизнес-эффект подтверждён · +3</strong>В результате одного пользовательского намерения созданы два разных заказа. Это точнее, чем называть строки дубликатами.</div><div class="actions"><button class="btn primary" data-next="16">Открыть Swagger</button></div>';bind()};
      const rf=document.getElementById('reportForm');if(rf)rf.onsubmit=e=>{e.preventDefault();const title=document.getElementById('rTitle').value.trim(),actual=document.getElementById('rActual').value.trim(),expected=document.getElementById('rExpected').value.trim(),err=document.getElementById('reportError');state.report={title,actual,expected};if(title.length<12||actual.length<15||expected.length<15){err.textContent='Добавь конкретики: заголовок от 12 символов, результаты — от 15.';save();return}points('report',4);setStep(19)};
      const copy=document.getElementById('copyResult');if(copy)copy.onclick=async()=>{const pct=Math.min(100,Math.round(Math.max(0,state.score)/40*100)),txt=`Первый день QA — ${state.name}: ${pct}%. Учебная смена завершена.`;try{await navigator.clipboard.writeText(txt);toast.textContent='Результат скопирован';toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');toast.textContent='Прогресс сохранён'},1200)}catch(e){alert(txt)}};
    }
    const context=document.modelContext;
    if(context?.registerTool){
      const toolAbort=new AbortController();
      Promise.resolve(context.registerTool({name:'get_qa_shift_progress',title:'Прогресс QA-смены',description:'Показывает текущий этап, имя участника и набранные баллы без изменения симуляции.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){return {name:state.name||null,step:state.step,totalSteps:steps.length,score:state.score,completed:state.step===steps.length-1}}},{signal:toolAbort.signal})).catch(()=>{});
    }
    render();
  })();
  </script>
</body>
</html>
